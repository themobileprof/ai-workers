<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Desk</title>
  <link rel="icon" href="/site/themobileprof_cloud.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/static/desk.css">
</head>
<body{{if eq .Nav "flows"}} class="framed"{{end}}>
  <div class="grain"></div>
  <div class="sky-glow" aria-hidden="true"></div>
  {{if .User}}
  <header class="mast">
    <a class="brand" href="/admin/">
      <img class="logo" src="/site/themobileprof_cloud.png" width="56" height="56" alt="TheMobileProf">
      <div>
        <p class="kicker">TheMobileProf · Lagos</p>
        <h1>Company desk</h1>
      </div>
    </a>
    <nav>
      <a href="/admin/" {{if eq .Nav "home"}}class="on"{{end}}>Board</a>
      {{range .NavDesks}}
      <a href="{{.Path}}" {{if or (eq $.Nav (printf "desk-%s" .Slug)) (eq $.Nav .Slug)}}class="on"{{end}}>{{.Title}}</a>
      {{end}}
      <a href="/admin/projects" {{if eq .Nav "projects"}}class="on"{{end}}>Projects</a>
      {{if .CanPeople}}<a href="/admin/users" {{if eq .Nav "users"}}class="on"{{end}}>People</a>{{end}}
      <a href="/admin/settings" {{if eq .Nav "settings"}}class="on"{{end}}>Defaults</a>
      <a href="/admin/integrations" {{if eq .Nav "tools"}}class="on"{{end}}>Tools</a>
      <a href="/admin/docs" {{if eq .Nav "docs"}}class="on"{{end}}>Docs</a>
      <a href="/admin/workflows" {{if eq .Nav "flows"}}class="on"{{end}}>n8n</a>
    </nav>
    <form class="out" method="post" action="/admin/logout">
      <button type="submit">Sign out {{.User.Name}}</button>
    </form>
  </header>
  {{end}}
  <main class="{{if eq .Nav "flows"}}canvas{{else if .User}}sheet{{else}}gate{{end}}">
    {{if .Flash}}<p class="flash">{{.Flash}}</p>{{end}}
    {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
    {{template "content" .}}
  </main>
  <script>
  (function () {
    function activate(root, id) {
      root.querySelectorAll('[role="tab"]').forEach(function (btn) {
        var on = btn.getAttribute("data-tab") === id;
        btn.classList.toggle("on", on);
        btn.setAttribute("aria-selected", on ? "true" : "false");
      });
      root.querySelectorAll('[role="tabpanel"]').forEach(function (panel) {
        var match = panel.getAttribute("data-tab") === id;
        panel.hidden = !match;
      });
      root.classList.add("is-on");
    }
    document.querySelectorAll("[data-tabs]").forEach(function (root) {
      var params = new URLSearchParams(location.search);
      var hash = location.hash.replace(/^#tab-?/, "").replace(/^#/, "");
      var ids = [];
      root.querySelectorAll('[role="tab"]').forEach(function (btn) {
        ids.push(btn.getAttribute("data-tab"));
      });
      var want = params.get("tab") || hash || root.getAttribute("data-default") || "";
      if (ids.indexOf(want) < 0) want = ids[0] || "";
      if (want) activate(root, want);
      root.querySelectorAll('[role="tab"]').forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-tab");
          activate(root, id);
          var url = new URL(location.href);
          url.searchParams.set("tab", id);
          history.replaceState(null, "", url);
        });
      });
    });
  })();
  </script>
</body>
</html>
