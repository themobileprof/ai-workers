{{define "content"}}
<section class="login-card">
  <img class="logo sit" src="/site/themobileprof_cloud.png" width="88" height="88" alt="TheMobileProf">
  <p class="kicker">Company desk</p>
  <h1>Sign in</h1>
  <p class="lede">Phone (234…) or email. This is not n8n — it holds people, WhatsApp accounts rights, and Zoho defaults.</p>
  <form method="post" action="/admin/login" class="stack">
    <label>Login<input name="login" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">
      <svg class="ico"><use href="#i-enter"/></svg>
      Enter
    </button>
  </form>
  <p class="hint"><a class="quiet" href="/">Back to the public page</a></p>
</section>
{{end}}
