services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.6
    restart: unless-stopped
    extra_hosts:
      # Compose bridge gateway (host), not docker0 — docker0 is down when nothing uses the default bridge.
      - "host.docker.internal:172.28.0.1"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: ${GENERIC_TIMEZONE:-Africa/Lagos}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Africa/Lagos}
      N8N_HOST: ${N8N_HOST:-0.0.0.0}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://workers.themobileprof.com/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_LICENSE_ACTIVATION_KEY: ${N8N_LICENSE_ACTIVATION_KEY:-}
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: host.docker.internal
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_POOL_SIZE: "5"
      DB_POSTGRESDB_SSL_ENABLED: "false"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro
    mem_limit: 1536m
    memswap_limit: 1536m
    networks:
      - agent-network
    depends_on:
      agents:
        condition: service_started

  agents:
    build:
      context: ./agents
      # Local compose compiles. VM deploy overlays docker-compose.deploy.yml
      # (Dockerfile.runtime + agents/dist/agents) so the 6 GB box never pulls golang.
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:172.28.0.1"
    ports:
      # Host-only so Caddy can proxy /admin. Not in UFW / OCI security list.
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      GOMAXPROCS: "1"
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Samuel}
      ADMIN_BOOTSTRAP_PHONE: ${ADMIN_BOOTSTRAP_PHONE:-2348033954301}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    mem_limit: 256m
    memswap_limit: 256m
    expose:
      - "8000"
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  n8n_data:
